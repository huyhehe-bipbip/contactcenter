<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Customer Live Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #f8fafc;
            color: #1e293b;
            overflow: hidden;
        }

        header {
            background: #0f766e;
            color: white;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-dot {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            background: rgba(255,255,255,0.2);
        }

        .view-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 28px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
        }

            .card h2 {
                font-size: 18px;
                margin-bottom: 8px;
                color: #0f766e;
            }

            .card p {
                font-size: 13px;
                color: #64748b;
                margin-bottom: 18px;
            }

        .form-group {
            margin-bottom: 14px;
        }

            .form-group label {
                display: block;
                font-size: 12px;
                font-weight: 600;
                margin-bottom: 6px;
                color: #475569;
            }

            .form-group input {
                width: 100%;
                padding: 10px 12px;
                border: 1px solid #cbd5e1;
                border-radius: 8px;
                font-size: 14px;
                outline: none;
            }

        .btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-teal {
            background: #0d9488;
            color: white;
        }

            .btn-teal:hover {
                background: #0f766e;
            }

        #chatScreen {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
        }

        .agent-banner {
            background: #f0fdf4;
            border-bottom: 1px solid #bbf7d0;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #166534;
        }

        .btn-end {
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        .msg-me {
            align-self: flex-end;
            background: #0d9488;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .msg-agent {
            align-self: flex-start;
            background: white;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 2px;
        }

        .msg-sys {
            align-self: center;
            font-size: 12px;
            background: #e2e8f0;
            color: #475569;
            padding: 4px 12px;
            border-radius: 999px;
        }

        .msg img {
            max-width: 200px;
            border-radius: 8px;
            margin-top: 6px;
            display: block;
        }

        .input-bar {
            padding: 12px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 8px;
            align-items: center;
        }

            .input-bar input[type="text"] {
                flex: 1;
                padding: 10px 12px;
                border: 1px solid #cbd5e1;
                border-radius: 8px;
                outline: none;
            }

        .btn-icon {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

            .btn-icon:hover {
                background: #e2e8f0;
            }

        .input-bar button:not(.btn-icon) {
            padding: 0 18px;
            height: 41px;
            background: #0d9488;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div><strong>💬 Hỗ Trợ Trực Tuyến</strong></div>
        <span id="connStatus" class="status-dot">Đang kết nối...</span>
    </header>

    <div id="startScreen" class="view-panel">
        <div class="card">
            <h2>Xin chào quý khách!</h2>
            <p>Vui lòng nhập thông tin để kết nối với nhân viên chăm sóc khách hàng.</p>
            <div class="form-group">
                <label>Mã khách hàng / SĐT</label>
                <input type="text" id="custIdInput" value="CUST_01" />
            </div>
            <div class="form-group">
                <label>Họ và tên của bạn</label>
                <input type="text" id="custNameInput" value="Nguyễn Văn A" />
            </div>
            <button class="btn btn-teal" onclick="requestSupport()">Bắt đầu Trò chuyện</button>
        </div>
    </div>

    <div id="chatScreen">
        <div class="agent-banner">
            <span id="agentStatusText">⏳ Đang tìm tổng đài viên...</span>
            <button class="btn-end" onclick="endSession()">Kết thúc</button>
        </div>
        <div class="messages" id="msgList"></div>
        <div class="input-bar">
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="sendImage(this)" />
            <button class="btn-icon" onclick="document.getElementById('imageInput').click()" title="Gửi hình ảnh">📷</button>
            <input type="text" id="chatInput" placeholder="Nhập câu hỏi của bạn..." disabled onkeydown="if(event.key==='Enter') sendMessage()" />
            <button id="sendBtn" disabled onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <script>
        let customerId = "";
        let customerName = "";
        let sessionId = null;
        let assignedAgentId = null;

        function sendPacketToCSharp(packetObj) {
            const json = JSON.stringify(packetObj);
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(json);
            }
        }

        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', event => {
                const packet = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                handleIncomingPacket(packet);
            });
        }

        function requestSupport() {
            customerId = document.getElementById("custIdInput").value.trim() || "CUST_01";
            customerName = document.getElementById("custNameInput").value.trim() || "Khách hàng";

            document.getElementById("startScreen").style.display = "none";
            document.getElementById("chatScreen").style.display = "flex";
            addMessage("SYS", "Đã gửi yêu cầu hỗ trợ. Đang chờ nhân viên tiếp nhận...", null);

            sendPacketToCSharp({
                Type: "CUSTOMER_REQ",
                Customer_ID: customerId,
                Customer_Name: customerName
            });
        }

        function handleIncomingPacket(packet) {
            if (packet.Type === "SYSTEM_CONN_STATUS") {
                document.getElementById("connStatus").textContent = packet.Connected ? "Đã kết nối Server" : "Mất kết nối";
                return;
            }

            if (packet.Type === "SESSION_ASSIGNED") {
                sessionId = packet.Session_ID;
                assignedAgentId = packet.Agent_ID;
                document.getElementById("agentStatusText").textContent = `🟢 Đang trò chuyện với Tư vấn viên (${assignedAgentId})`;
                document.getElementById("chatInput").disabled = false;
                document.getElementById("sendBtn").disabled = false;
                addMessage("SYS", `Tư vấn viên ${assignedAgentId} đã tham gia phiên hỗ trợ (${sessionId}).`, null);
            }
            else if (packet.Type === "CHAT_MSG") {
                addMessage("AGENT", packet.Content, packet.Attachment);
            }
            else if (packet.Type === "END_SESSION") {
                document.getElementById("agentStatusText").textContent = "🔴 Phiên hỗ trợ đã kết thúc";
                document.getElementById("chatInput").disabled = true;
                document.getElementById("sendBtn").disabled = true;
                addMessage("SYS", "Phiên trò chuyện đã kết thúc. Cảm ơn quý khách!", null);
            }
        }

        function sendMessage() {
            const input = document.getElementById("chatInput");
            const text = input.value.trim();
            if (!text || !sessionId) return;

            addMessage("ME", text, null);
            input.value = "";

            sendPacketToCSharp({
                Type: "CHAT_MSG",
                Session_ID: sessionId,
                Agent_ID: assignedAgentId,
                Customer_ID: customerId,
                Sender: customerId,
                Content: text,
                Attachment: null
            });
        }

        function sendImage(input) {
            if (input.files && input.files[0] && sessionId) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const base64Data = e.target.result;

                    addMessage("ME", "[Hình ảnh]", base64Data);

                    sendPacketToCSharp({
                        Type: "CHAT_MSG",
                        Session_ID: sessionId,
                        Agent_ID: assignedAgentId,
                        Customer_ID: customerId,
                        Sender: customerId,
                        Content: "[Hình ảnh]",
                        Attachment: base64Data
                    });
                };
                reader.readAsDataURL(input.files[0]);
                input.value = ""; // Reset file input
            }
        }

        function endSession() {
            if (sessionId) {
                sendPacketToCSharp({
                    Type: "END_SESSION",
                    Session_ID: sessionId,
                    Agent_ID: assignedAgentId,
                    Customer_ID: customerId,
                    Sender: customerId
                });
            }
            handleIncomingPacket({ Type: "END_SESSION" });
        }

        function addMessage(role, text, attachment) {
            const list = document.getElementById("msgList");
            const div = document.createElement("div");

            if (role === "SYS") div.className = "msg msg-sys";
            else if (role === "ME") div.className = "msg msg-me";
            else div.className = "msg msg-agent";

            let htmlContent = "";
            if (text && text !== "[Hình ảnh]") {
                htmlContent += `<div>${escapeHtml(text)}</div>`;
            }
            if (attachment) {
                htmlContent += `<img src="${attachment}" />`;
            }
            if (!htmlContent && text) {
                htmlContent = `<div>${escapeHtml(text)}</div>`;
            }

            div.innerHTML = htmlContent;
            list.appendChild(div);
            list.scrollTop = list.scrollHeight;
        }

        function escapeHtml(unsafe) {
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
